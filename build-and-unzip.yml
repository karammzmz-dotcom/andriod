name: Build and Unzip

# Unzips the original Arduboy3D source, assembles it into an SDL2 Android
# project, and builds an installable APK.
#
# Trigger manually from the Actions tab, or on every push.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. Unzip the original Arduboy3D (Catacombs) source archive
      # ---------------------------------------------------------------
      - name: Unzip Arduboy3D source
        run: |
          unzip -o Arduboy3D-1_0.zip -d game_source
          find game_source -maxdepth 3 -type d

      # ---------------------------------------------------------------
      # 2. Toolchain
      # ---------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      # ---------------------------------------------------------------
      # 3. Fetch SDL2 and its ready-made Android Studio template.
      #    This gives us a known-good SDLActivity.java, gradle wrapper,
      #    manifest and build.gradle, which we then fill in with our game.
      # ---------------------------------------------------------------
      - name: Fetch SDL2
        run: |
          git clone --branch release-2.30.x --depth 1 https://github.com/libsdl-org/SDL.git sdl2_src

      - name: Assemble Android project
        run: |
          set -e
          rm -rf android
          cp -r sdl2_src/android-project android

          # Full SDL2 source, built from source alongside our game via CMake.
          rm -rf android/app/jni/SDL
          cp -r sdl2_src android/app/jni/SDL

          # Replace the sample native target with our own CMake script.
          rm -f android/app/jni/CMakeLists.txt
          cp custom/CMakeLists.txt android/app/jni/CMakeLists.txt

          # Drop in the game engine source (everything except the Arduino
          # .ino sketch, which is replaced by AndroidMain.cpp below).
          rm -rf android/app/jni/src
          mkdir -p android/app/jni/src/Generated
          cp game_source/Arduboy3D-1.0/Source/Arduboy3D/*.cpp android/app/jni/src/
          cp game_source/Arduboy3D-1.0/Source/Arduboy3D/*.h   android/app/jni/src/
          cp game_source/Arduboy3D-1.0/Source/Arduboy3D/Generated/* android/app/jni/src/Generated/

          # Our platform glue (controller + keyboard, no on-screen controls)
          # and a patched, portable Defines.h (no AVR dependency).
          cp custom/AndroidMain.cpp android/app/jni/src/
          cp custom/Defines.h android/app/jni/src/Defines.h

          # Friendly app name, if the template's strings.xml matches.
          sed -i 's/SDL App/Catacombs of the Damned/' android/app/src/main/res/values/strings.xml || true

      # ---------------------------------------------------------------
      # 4. Build
      # ---------------------------------------------------------------
      - name: local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: find android -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: catacombs-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
