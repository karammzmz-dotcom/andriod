
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find . -type f -name settings.gradle -not -path './.git/*' -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Android project not found."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Arduboy game collection
        run: |
          git clone --depth 1 https://github.com/eried/ArduboyCollection.git "$RUNNER_TEMP/ArduboyCollection"

      - name: Prepare up to 25 additional games
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("extracted-project/scripts/prepare_games.py")
          if not p.exists():
              raise SystemExit("Game preparation script not found.")
          s = p.read_text()
          if "len(entries)>=40" not in s or "len(entries)<5" not in s:
              raise SystemExit("Unexpected prepare_games.py version; refusing to patch.")
          s = s.replace("len(entries)>=40", "len(entries)>=25")
          s = s.replace("len(entries)<5", "len(entries)<20")
          p.write_text(s)
          PY
          python "$PROJECT_DIR/scripts/prepare_games.py" \
            "$RUNNER_TEMP/ArduboyCollection" \
            "$PROJECT_DIR/app/src/main/assets"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Catacombs-Android-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
