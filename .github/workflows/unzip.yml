
name: Unzip Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted-project
          unzip -o ArduboyCatacombs-Android-FIXED4.zip -d extracted-project

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted-project
          git commit -m "Extract ArduboyCatacombs Android project" || echo "No changes to commit"
          git push
