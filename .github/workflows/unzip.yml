name: Unzip Source and Build APK
on:
  workflow_dispatch:
jobs:
  unzip-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip original Arduboy source if archive is present
        shell: bash
        run: |
          if [ -f "Arduboy3D-1.0.zip" ]; then
            mkdir -p original-arduboy-source
            unzip -oq "Arduboy3D-1.0.zip" -d original-arduboy-source
          else
            echo "Archive not required; extracted source is already included."
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Catacombs-Android-debug
          path: app/build/outputs/apk/debug/*.apk
