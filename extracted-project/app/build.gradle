plugins { id 'com.android.application' }

android {
    namespace 'com.catacombs.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.catacombs.game'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O2' }
        }
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}
